<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overview - codex-agent</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header></header>
<main>
  <h1>Overview</h1>
  <p class="sub">Current state of every ticket. A ticket's folder is its state.</p>

  <div class="counters" id="counters"></div>
  <div class="rate-line" id="rate"></div>

  <p style="margin-top:16px">
    <button class="primary" id="processAll">Process all inbox tickets</button>
    <button id="refresh">Refresh</button>
  </p>

  <h2>Board</h2>
  <div class="board" id="board"></div>
</main>

<script src="app.js"></script>
<script>
const COLS = [
  { key: 'new',              title: 'Inbox',     cls: ''      },
  { key: 'grouped',          title: 'Grouped',   cls: ''      },
  { key: 'needs',            title: 'Needs you', cls: 'needs' },
  { key: 'awaiting-info',    title: 'Awaiting',  cls: 'await' },
  { key: 'escalated',        title: 'Escalated', cls: 'esc'   },
  { key: 'resolved',         title: 'Resolved',  cls: 'done'  }
];

function colOf(t) {
  if (needsYou(t)) return 'needs';
  return t.state;
}

function card(t, cls) {
  const bits = [];
  if (t.agent) bits.push('<span class="tag">' + t.agent + '</span>');
  if (t.runbook) bits.push(t.runbook.split('-').slice(0, 2).join('-'));
  if (hasWrite(t)) bits.push('<span class="tag write">WRITE</span>');
  if (t.state === 'pending-grouping') bits.push('<span class="tag">group?</span>');
  if (t.escalation_reason) bits.push(t.escalation_reason);
  const c = t.confidence || {};
  const score = c.action != null ? c.action : c.grouping;
  if (score != null) bits.push('conf ' + score.toFixed(2));

  return '<div class="card-wrap">' +
    '<div class="card ' + cls + '" ' +
      (cls === 'needs' ? 'onclick="location.href=\'review.html\'"' : '') + '>' +
      '<div class="num">' + t.number + '</div>' +
      '<div class="desc">' + t.short_description + '</div>' +
      '<div class="meta">' + bits.join(' ') + '</div>' +
    '</div>' +
    cardDetail(t) +
  '</div>';
}

function cardDetail(t) {
  const c = t.confidence || {};

  const rows = [
    ['Agent', t.agent],
    ['State', t.state],
    ['Caller', t.caller],
    ['Language', t.language],
    ['Created', t.created_at ? fmtTime(t.created_at) + ' ' + new Date(t.created_at).toLocaleDateString() : null],
    ['Runbook', t.runbook],
    ['Grouping conf', c.grouping != null ? c.grouping.toFixed(2) : null],
    ['Action conf', c.action != null ? c.action.toFixed(2) : null],
    ['Approval reason', t.approval_reason],
    ['AI time', t.metrics && t.metrics.ai_seconds != null ? fmtDuration(t.metrics.ai_seconds) : null],
    ['Human wait', t.metrics && t.metrics.human_wait_seconds != null ? fmtDuration(t.metrics.human_wait_seconds) : null],
    ['Tokens', t.metrics && t.metrics.tokens != null ? t.metrics.tokens.toLocaleString() : null],
    ['Run id', t.run_id]
  ].filter(([, v]) => v != null && v !== '')
   .map(([l, v]) => '<div class="dd-row"><span class="dd-l">' + l + '</span><span class="dd-v">' + escHtml(v) + '</span></div>')
   .join('');

  const altRows = (t.alternatives || []).map(a =>
    '<div class="dd-row"><span class="dd-l">' + escHtml(a.agent) + '</span>' +
    '<span class="dd-v">' + a.score.toFixed(2) + '</span></div>').join('');

  const matchReasons = (t.match_reason || []).length
    ? (t.match_reason || []).map(m => '<span class="tag">' + escHtml(m) + '</span>').join(' ')
    : '';

  const argRow = args => Object.entries(args || {})
    .map(([k, v]) => '<div class="dd-arg"><b>' + escHtml(k) + '</b>: ' + escHtml(v) + '</div>').join('');

  const planRows = (t.plan || []).map(s =>
    '<div class="dd-step"><code>' + escHtml(s.tool) + '</code>' +
    (s.write ? ' <span class="tag write">WRITE</span>' : ' <span class="tag read">read</span>') +
    argRow(s.args) +
    (s.rollback ? '<div class="dd-rb">rollback: ' + escHtml(s.rollback) + '</div>' : '') +
    '</div>').join('');

  const planAltRows = (t.plan_alternatives || []).length
    ? '<div class="dd-sect">Plan alternatives</div>' +
      (t.plan_alternatives || []).map(p => '<div class="dd-step">' + escHtml(p.label || p.summary || JSON.stringify(p)) + '</div>').join('')
    : '';

  return '<div class="card-detail">' +
    '<div class="dd-head">' + t.number + ' &mdash; ' + escHtml(t.short_description) + '</div>' +
    (t.description ? '<div class="dd-desc">' + escHtml(t.description) + '</div>' : '') +
    (matchReasons ? '<div class="dd-sect">Matched on</div><div class="dd-tags">' + matchReasons + '</div>' : '') +
    rows +
    (altRows ? '<div class="dd-sect">Alternatives</div>' + altRows : '') +
    (t.evidence ? '<div class="dd-sect">Evidence</div><div class="dd-desc">' + escHtml(t.evidence) + '</div>' : '') +
    (planRows ? '<div class="dd-sect">Plan</div>' + planRows : '') +
    planAltRows +
  '</div>';
}

async function load() {
  const b = await getJSON('board.json');
  renderNav('overview', b.counts.needs_you);
  stamp(b.generated_at);

  const c = b.counts;
  document.getElementById('counters').innerHTML = [
    ['', c.unprocessed || 0,    'Unprocessed'],
    ['', c.grouped || 0,   'Grouped'],
    ['needs', c.needs_you || 0, 'Needs you'],
    ['info', c.awaiting_info || 0, 'Awaiting info'],
    ['esc',  c.escalated || 0,  'Escalated'],
    ['done', c.resolved_today || 0, 'Resolved today']
  ].map(([cls, n, l]) =>
    '<div class="counter ' + cls + '"><div class="n">' + n + '</div>' +
    '<div class="l">' + l + '</div></div>').join('');

  const a = b.auto_handled;
  const thr = b.thresholds || { grouping: '?', action: '?' };
  document.getElementById('rate').innerHTML =
    'Auto-handled today: <b>' + a.count + ' of ' + a.total + '</b> (' +
    Math.round(a.rate * 100) + '%) &mdash; resolved with no human decision. ' +
    '<span style="color:var(--muted)">Thresholds: grouping ' +
    thr.grouping + ', action ' + thr.action + '.</span>';

  document.getElementById('board').innerHTML = COLS.map(col => {
    const items = b.tickets.filter(t => colOf(t) === col.key);
    return '<div class="col"><h3>' + col.title + '<span>' + items.length +
      '</span></h3>' + items.map(t => card(t, col.cls)).join('') + '</div>';
  }).join('');
}

document.getElementById('refresh').onclick = load;
document.getElementById('processAll').onclick = async () => {
  const r = await runInCodex('all', 'process');
  if (r) load();
};
load().catch(e => document.querySelector('main').innerHTML =
  '<div class="empty">' + e.message + '</div>');
</script>
</body>
</html>
